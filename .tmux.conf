# Initialize TMUX plugin manager (keep this line at the very bottom of
# tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_title}"
bind-key b command-prompt -p "Pane name:" "select-pane -T \"%%\""
bind-key , command-prompt -I "#W" -p "Window name:" "rename-window -- '%%'"

# Pane border appearance
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# Make the pane title text itself bold and bright
set -g pane-border-format "#[fg=colour33,bold] #{pane_index} #{pane_title} "
set -g pane-border-status top
