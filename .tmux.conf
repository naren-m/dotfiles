# make tmux display things in 256 colors
set -g default-terminal "screen-256color"


# make ZSh the default terminal
# set scrollback history to 10000 (10k)
set -g history-limit 10000

# set Ctrl-a as the default prefix key combination
# and unbind C-b to free it up
set -g prefix C-a
unbind C-b

# use send-prefix to pass C-a through to application
bind C-a send-prefix

# shorten command delay
set -sg escape-time 1

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1


# and use C-h and C-l to cycle thru panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind -n C-x send-keys -R \; clear-history

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# VIM Copy
# Then hit Ctrl+b [ to enter copy mode. Then hit Space followed by whatever vi movement keys to make a selection. Then, instead of hitting Enter, hit y and the selection will be copied to the clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# set some pretty colors
# ----------------------
# set pane colors - hilight the active pane
# set-option -g pane-border-fg colour235 #base02
# set-option -g pane-active-border-fg colour240 #base01

# colorize messages in the command line
# set-option -g message-bg black #base02
# set-option -g message-fg brightred #orange

# ----------------------
# Status Bar
# -----------------------
set-option -g status on                # turn the status bar on
# set -g status-utf8 on                  # set utf-8 for the status bar
set -g status-interval 5               # set update frequencey (default 15 seconds)
set -g status-justify centre           # center window list for clarity
# set-option -g status-position top    # position the status bar at top of screen

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Terminal bell: propagate bell from any pane to the terminal
set -g bell-action any
set -g visual-bell off

# Select and resize panes with mouse
set-option -g mouse on
# set -g mouse on # For mac
# set-option -g select-pane on
# set -g mouse-select-window on
# set -g mouse-resize-pane on
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-resurrect: Restore tmux environment after system restart.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'

# ----------------------
# Theme selection: pick ONE option below.
#   Option 1 (active): tmux-themepack powerline/block/cyan
#   Option 2: Catppuccin (uncomment its @plugin + settings below)
#   Option 3: Powerkit with CPU + memory (uncomment its @plugin + settings below)
# After switching: `prefix + I` to install new plugins, then `prefix + r` to reload.
# ----------------------

# Option 1: themepack (uses jimeh/tmux-themepack already loaded above)
set -g @themepack 'powerline/block/cyan'
# set -g @themepack 'powerline/default/gray'
# set -g @themepack 'powerline/double/blue'

# Themepack right-side slots: inject CPU + RAM via tmux-cpu plugin.
# These overrides must be set BEFORE themepack runs (via TPM at the bottom of file).
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @themepack-status-right-area-left-format  "CPU #{cpu_percentage}"
set -g @themepack-status-right-area-middle-format "RAM #{ram_percentage}"
set -g @themepack-status-right-area-right-format  "%H:%M %d-%b"

# Clear themepack's cached @theme-* / @powerline-* options so reloads
# (and theme switches) pick up the new theme cleanly.
# Themepack uses `set -goq` for these, which sticks across source-file reloads.
set -gu @theme-status-left
set -gu @theme-status-right
set -gu @powerline-color-main-1
set -gu @powerline-color-main-2
set -gu @powerline-color-main-3
set -gu @powerline-color-activity-1
set -gu @powerline-status-bg
set -gu @powerline-status-fg
set -gu @powerline-status-left-area-left-bg
set -gu @powerline-status-left-area-left-fg
set -gu @powerline-status-left-area-middle-bg
set -gu @powerline-status-left-area-middle-fg
set -gu @powerline-status-left-area-right-bg
set -gu @powerline-status-left-area-right-fg
set -gu @powerline-status-right-area-left-bg
set -gu @powerline-status-right-area-left-fg
set -gu @powerline-status-right-area-middle-bg
set -gu @powerline-status-right-area-middle-fg
set -gu @powerline-status-right-area-right-bg
set -gu @powerline-status-right-area-right-fg

